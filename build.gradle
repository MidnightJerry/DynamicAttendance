plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.beng.attendance'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.beng.attendance.Main'
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.graphics', 'javafx.swing']
}

dependencies {
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'com.google.zxing:javase:3.5.1'
}

// Create a fat JAR with all dependencies
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    manifest {
        attributes 'Main-Class': 'com.beng.attendance.Main'
    }
    archiveBaseName = 'AttendanceApp'
    archiveVersion = ''

    // Exclude signature files that can cause issues
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}

// Task to create native executable using jpackage
tasks.register('createInstaller') {
    dependsOn jar
    doLast {
        def os = System.getProperty('os.name').toLowerCase()
        def outputDir = file("${buildDir}/installer")

        // Delete existing output directory
        delete outputDir
        outputDir.mkdirs()

        if (os.contains('win')) {
            // Windows
            exec {
                commandLine 'jpackage',
                        '--type', 'app-image',
                        '--input', "${buildDir}/libs",
                        '--main-jar', 'AttendanceApp.jar',
                        '--main-class', 'com.beng.attendance.Main',
                        '--name', 'AttendanceApp',
                        '--dest', outputDir.absolutePath,
                        '--win-console',
                        '--vendor', 'DynamicAttendance'
            }
        } else if (os.contains('mac')) {
            // macOS
            exec {
                commandLine 'jpackage',
                        '--type', 'app-image',
                        '--input', "${buildDir}/libs",
                        '--main-jar', 'AttendanceApp.jar',
                        '--main-class', 'com.beng.attendance.Main',
                        '--name', 'AttendanceApp',
                        '--dest', outputDir.absolutePath,
                        '--mac-package-name', 'Attendance QR',
                        '--vendor', 'DynamicAttendance'
            }
        } else {
            // Linux
            exec {
                commandLine 'jpackage',
                        '--type', 'app-image',
                        '--input', "${buildDir}/libs",
                        '--main-jar', 'AttendanceApp.jar',
                        '--main-class', 'com.beng.attendance.Main',
                        '--name', 'AttendanceApp',
                        '--dest', outputDir.absolutePath,
                        '--vendor', 'DynamicAttendance'
            }
        }
    }
}