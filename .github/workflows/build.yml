name: Build Attendance App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
        shell: bash

      - name: Build with Gradle (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew build --no-daemon
        shell: cmd

      - name: Create ZIP (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp build/libs/*.jar dist/
          cd dist
          zip -r ../DynamicAttendance-${{ runner.os }}.zip .
        shell: bash

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy build\libs\*.jar dist\
          powershell Compress-Archive -Path dist\* -DestinationPath DynamicAttendance-Windows.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicAttendance-${{ runner.os }}
          path: |
            DynamicAttendance-*.zip
            build/libs/*.jar