name: Build Attendance App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix gradlew permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build JAR (Windows)
        if: runner.os == 'Windows'
        run: gradlew.bat jar --no-daemon
        shell: cmd

      - name: Build JAR (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./gradlew jar --no-daemon
        shell: bash

      - name: Create Windows executable
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          jpackage --type app-image `
            --input build/libs `
            --main-jar dynamic-attendance-1.0.0.jar `
            --main-class com.dynamicattendance.Main `
            --name AttendanceApp `
            --dest dist
          Compress-Archive -Path dist\AttendanceApp -DestinationPath AttendanceApp-Windows.zip
        shell: powershell

      - name: Create macOS executable
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          jpackage --type app-image \
            --input build/libs \
            --main-jar dynamic-attendance-1.0.0.jar \
            --main-class com.dynamicattendance.Main \
            --name AttendanceApp \
            --dest dist
          zip -r AttendanceApp-macOS.zip dist/AttendanceApp.app
        shell: bash

      - name: Create Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          jpackage --type app-image \
            --input build/libs \
            --main-jar dynamic-attendance-1.0.0.jar \
            --main-class com.dynamicattendance.Main \
            --name AttendanceApp \
            --dest dist
          zip -r AttendanceApp-Linux.zip dist/AttendanceApp
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-${{ runner.os }}
          path: |
            *.zip