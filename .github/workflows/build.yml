name: Build Native Executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Fix gradlew permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
        shell: bash

      - name: Build JAR (Windows)
        if: runner.os == 'Windows'
        run: gradlew.bat jar --no-daemon
        shell: cmd

      - name: Build JAR (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./gradlew jar --no-daemon
        shell: bash

      - name: List JAR files (debug)
        run: |
          echo "Contents of build/libs:"
          ls -la build/libs/
        shell: bash

      - name: Create Windows executable
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          jpackage ^
            --type app-image ^
            --input build/libs ^
            --main-jar AttendanceApp.jar ^
            --main-class com.beng.attendance.Main ^
            --name AttendanceApp ^
            --dest dist ^
            --win-console ^
            --vendor "DynamicAttendance"
          
          if exist "dist\AttendanceApp" (
            powershell Compress-Archive -Path "dist\AttendanceApp" -DestinationPath "AttendanceApp-Windows.zip" -Force
            echo "Successfully created AttendanceApp-Windows.zip"
          ) else (
            echo "ERROR: dist\AttendanceApp not found"
            exit 1
          )
        shell: cmd

      - name: Create macOS executable
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          jpackage \
            --type app-image \
            --input build/libs \
            --main-jar AttendanceApp.jar \
            --main-class com.beng.attendance.Main \
            --name AttendanceApp \
            --dest dist \
            --mac-package-name "Attendance QR" \
            --vendor "DynamicAttendance"
          
          if [ -d "dist/AttendanceApp.app" ]; then
            zip -r AttendanceApp-macOS.zip dist/AttendanceApp.app
            echo "Successfully created AttendanceApp-macOS.zip"
          else
            echo "ERROR: dist/AttendanceApp.app not found"
            exit 1
          fi
        shell: bash

      - name: Create Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          jpackage \
            --type app-image \
            --input build/libs \
            --main-jar AttendanceApp.jar \
            --main-class com.beng.attendance.Main \
            --name AttendanceApp \
            --dest dist \
            --vendor "DynamicAttendance"
          
          if [ -d "dist/AttendanceApp" ]; then
            zip -r AttendanceApp-Linux.zip dist/AttendanceApp
            echo "Successfully created AttendanceApp-Linux.zip"
          else
            echo "ERROR: dist/AttendanceApp not found"
            exit 1
          fi
        shell: bash

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-Windows
          path: AttendanceApp-Windows.zip
          retention-days: 30

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-macOS
          path: AttendanceApp-macOS.zip
          retention-days: 30

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-Linux
          path: AttendanceApp-Linux.zip
          retention-days: 30