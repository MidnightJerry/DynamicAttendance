name: Build Native Executables

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew jar

      - name: Build native executable
        uses: dlemstra/jpackage-action@main
        with:
          name: AttendanceApp
          input: build/libs
          main-jar: $(find build/libs -name "*.jar" ! -name "*-javadoc*" ! -name "*-sources*")
          main-class: com.dynamicattendance.Main
          type: ${{ runner.os == 'windows-latest' && 'app-image' || runner.os == 'macos-latest' && 'dmg' || 'deb' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AttendanceApp-${{ runner.os }}
          path: |
            build/jpackage/*